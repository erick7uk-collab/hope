<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess the Number Game</title>


  <link rel="stylesheet" href="styles.css">

  
</head>

<body>
  <!-- ===== LOGIN / REGISTER SECTION ===== -->
  <div id="login-box">
    <h2>Login / Register</h2>

    <!-- basic user info -->
    <input id="user_name" type="text" placeholder="Enter username" />
    <input id="user_email" type="email" placeholder="Email address" />

    <!-- actions -->
    <button onclick="register()">Sign Up</button>
    <button onclick="login()">Login</button>

    <!-- this for small error messages -->
    <div id="login-error" style="color:red;"></div>
  </div>

  <!-- ===== GAME SECTION ===== -->
  <div id="game-container" style="display:none;">
    <h2>Guess the Number!</h2>

    <div id="welcome-text"></div>

    <div class="guess-section">
      <label for="guess">Pick a number between 1 and 20:</label>
      <input id="guess" type="number" min="1" max="20" />
      <button onclick="makeGuess()">Submit Guess</button>

      <!-- feedback will appear here -->
      <div id="feedback"></div>
    </div>

    <div>Attempts so far: <span id="attempts">0</span></div>

    <!-- user controls -->
    <div class="btn-group">
      <button onclick="logout()">Logout</button>
      <button id="rank-btn" onclick="showRanking()" style="display:none;">
        Show Leaderboard
      </button>
    </div>
  </div>

  <!-- ===== LEADERBOARD SECTION ===== -->
  <div id="ranking-container" style="display:none;">
    <h2> Leaderboard</h2>
    <div id="ranking-table"></div>
    <button onclick="showGame()">← Back to Game</button>
  </div>

  <!-- linking JS -->
  <script src="game.js"></script>
</body>
</html>
